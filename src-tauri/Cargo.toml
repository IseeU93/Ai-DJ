[package]
name = "ai-dj-mixer"
version = "0.2.0"
description = "Automix – lokales DJ-Set aus einem Ordner"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[features]
custom-protocol = ["tauri/custom-protocol"]
