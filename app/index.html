<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Automix</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="main.js"></script>
</head>
<body>
 <div class="shell" id="shell" data-laser="off" data-side="right">
  <div class="app">
    <header class="topbar">
      <span class="brand">Automix</span>
      <button class="btn" id="btn-library" title="Bibliothek: Ordner durchstöbern, Tracks einreihen oder sofort reinmixen – ohne die laufende Musik zu ändern">Bibliothek</button>
      <button class="btn" id="btn-folder" title="Oberordner wählen – Unterordner erscheinen als Playlists">Ordner wählen</button>
      <span class="folder" id="folder">Kein Ordner geladen</span>
      <select class="sel" id="playlist" title="Unterordner als Playlist" hidden></select>
      <select class="sel" id="playlist-genre" title="Musikrichtung für die ganze Playlist (einzelne Tracks in der Queue überschreibbar)" hidden></select>
      <div class="progress" id="progress" hidden>
        <div class="bar"><i></i></div>
        <span></span>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="btn-laser" title="Lasershow einblenden – synchron zur Musik, gesteuert aus der Track-Analyse (Taste L)">Lasershow</button>
      <label class="switch" title="Übergänge automatisch planen und fahren – deine Queue-Reihenfolge bleibt">
        <input type="checkbox" id="automix" checked /><i></i><span>Automix</span>
      </label>
      <label class="switch" title="Voller Autopilot: startet selbst, sortiert die Queue laufend neu, wählt alle Übergänge und spielt endlos weiter">
        <input type="checkbox" id="autopilot" /><i></i><span>Autopilot</span>
      </label>
      <div class="master">
        <span class="lbl">Master</span>
        <div class="slider h" id="master-vol" style="width: 120px"></div>
      </div>
    </header>

    <main class="stage">
      <section class="deck" data-deck="0"></section>
      <section class="mixer">
        <div class="strips">
          <div class="strip" data-deck="0"></div>
          <div class="strip" data-deck="1"></div>
        </div>
        <div class="xfader">
          <span class="lbl">A</span>
          <div class="slider h" id="xfader"></div>
          <span class="lbl">B</span>
        </div>
      </section>
      <section class="deck" data-deck="1"></section>
    </main>

    <section class="transition">
      <div class="tr-info">
        <div class="lbl" id="tr-title">Nächster Übergang</div>
        <div class="name" id="tr-name">–</div>
        <div class="notes" id="tr-notes"></div>
        <div class="reason" id="tr-reason"></div>
      </div>
      <div class="tr-timeline"><canvas id="tr-canvas"></canvas></div>
      <div class="tr-actions">
        <span class="tr-count" id="tr-count"></span>
        <select class="sel" id="tr-type"></select>
        <button class="btn" id="btn-jump" title="Test: 4 Takte vor den geplanten Übergang springen">Zum Übergang</button>
        <button class="btn" id="btn-mixnow">Jetzt mixen</button>
      </div>
    </section>

    <div class="libwin" id="libwin" hidden>
      <div class="libwin-head">
        <b>Bibliothek</b>
        <span class="folder" id="lib-root"></span>
        <button class="btn small" id="lib-open">Anderer Ordner …</button>
        <div class="spacer"></div>
        <button class="btn small" id="lib-take" title="Nach dem aktuellen Track mit dieser Playlist weitermachen (KI-sortiert)">Playlist übernehmen</button>
        <button class="btn small" id="lib-close" title="Schließen">×</button>
      </div>
      <div class="libwin-body">
        <div class="lib-folders" id="lib-folders"></div>
        <div class="lib-tracks">
          <div class="lib-status" id="lib-status"></div>
          <input class="lib-search" id="lib-search" placeholder="Suchen …" />
          <div id="lib-list"></div>
        </div>
      </div>
    </div>

    <section class="queue">
      <div class="queue-head">
        <h2>Queue</h2>
        <span class="info" id="queue-info"></span>
        <div class="spacer"></div>
        <button class="btn" id="btn-reorder" title="Beste Reihenfolge für die Übergänge (Tempo, Tonart, Intros/Outros, Energie-Verlauf)">KI-Reihenfolge</button>
        <button class="btn" id="btn-reshuffle" title="Andere Reihenfolge, die ebenfalls gut ineinander passt">Reshuffle</button>
        <button class="btn primary" id="btn-start" disabled>Start</button>
      </div>
      <div class="qlist" id="queue"></div>
      <div class="removed" id="removed" hidden></div>
    </section>
  </div>

  <div class="splitter" id="lz-split" title="Ziehen: Aufteilung ändern · Doppelklick: zurücksetzen"></div>
  <section class="laserpane" id="laserpane" hidden>
    <div class="lz-head">
      <b>Lasershow</b>
      <span class="lz-status" id="lz-status"></span>
      <div class="spacer"></div>
      <div class="seg" id="lz-mode">
        <button data-mode="split" title="Mixer und Laser nebeneinander">Geteilt</button>
        <button data-mode="full" title="Nur Laser (Esc zurück)">Vollbild</button>
      </div>
      <button class="btn small" id="lz-swap" title="Laser links/rechts">⇄</button>
      <button class="btn small" id="lz-beamer" title="Eigenes Fenster für Beamer/2. Monitor (dort Doppelklick = Vollbild)">Beamer-Fenster</button>
      <button class="btn small" id="lz-close" title="Lasershow ausblenden">×</button>
    </div>
    <div class="lz-view">
      <canvas id="lz-canvas"></canvas>
      <div class="lz-overlay" id="lz-overlay">
        <span class="lz-now" id="lz-now"></span>
        <button class="btn small" id="lz-mixnow">Jetzt mixen</button>
        <button class="btn small" id="lz-exitfull">Mixer zeigen</button>
      </div>
    </div>
    <div class="lz-controls">
      <label class="switch" title="Choreograph wählt Effekte, Farben, Strobe und Blackouts passend zur Musik"><input type="checkbox" id="lz-auto" /><i></i><span>Autopilot</span></label>
      <label class="switch" title="Beatgrid, Builds und Drops aus der MP3-Analyse statt live geraten – Szenenwechsel exakt auf der Eins, Blackout genau vor dem Drop"><input type="checkbox" id="lz-sync" /><i></i><span>Track-Sync</span></label>
      <label class="switch" title="Farben aus der Tonart des laufenden Tracks"><input type="checkbox" id="lz-keycol" /><i></i><span>Tonart-Farben</span></label>
      <label class="switch" title="Strobe/Blitze erlauben"><input type="checkbox" id="lz-strobe" /><i></i><span>Strobe</span></label>
      <select class="sel" id="lz-intensity" title="Wie heftig die Show eskaliert – Auto richtet sich nach der Musikrichtung des Tracks">
        <option value="auto">Intensität: Auto (Genre)</option>
        <option value="0.2">Intensität: Niedrig</option>
        <option value="0.45">Intensität: Mittel</option>
        <option value="0.7">Intensität: Hoch</option>
        <option value="1">Intensität: Vollgas</option>
      </select>
      <select class="sel" id="lz-effect" title="Effekt (nur ohne Autopilot)"></select>
      <select class="sel" id="lz-palette" title="Farbe (nur ohne Autopilot)"></select>
      <button class="btn small" id="lz-blackout" title="Laser sofort aus (B)">Blackout</button>
    </div>
  </section>
 </div>
</body>
</html>
